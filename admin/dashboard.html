<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة أجّل</title>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

.header {
  background: #1d4ed8;
  color: white;
  padding: 20px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

.container {
  padding: 25px;
  max-width: 1000px;
  margin: auto;
}

.welcome {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.welcome h2 {
  color: #1d4ed8;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h3 {
  margin: 0 0 10px;
}

.number {
  font-size: 30px;
  font-weight: bold;
  color: #1d4ed8;
}

.clickable {
  cursor: pointer;
}

.clickable:active {
  transform: scale(.98);
}

button {
  padding: 10px 20px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  background: #1d4ed8;
  color: white;
  margin: 5px;
  font-size: 16px;
}

.logout {
  background: #dc2626;
}

.live {
  display: block;
  margin-top: 8px;
  font-size: 13px;
  color: #16a34a;
}

.error {
  color: #dc2626;
  font-size: 13px;
  margin-top: 8px;
}

@media(max-width:600px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .container {
    padding: 15px;
  }

}

</style>

</head>


<body>


<div class="header">

<h1>
لوحة إدارة أجّل
</h1>

</div>


<div class="container">


<div class="welcome">

<h2>
مرحبًا بك في لوحة الإدارة
</h2>

<p>
تم تسجيل الدخول بنجاح ✅
</p>


<button
  class="logout"
  id="logoutBtn">

تسجيل الخروج

</button>

</div>



<div class="cards">


<!-- الحجوزات -->

<div
  class="card clickable"
  onclick="location.href='transport-orders.html'">

<h3>
🚐 الحجوزات
</h3>

<div
  id="bookingsCount"
  class="number">

...

</div>

<span class="live">
● تحديث تلقائي
</span>

<div
  id="bookingsError"
  class="error">
</div>

</div>



<!-- التأشيرات -->

<div class="card">

<h3>
🛂 طلبات التأشيرات
</h3>

<div
  id="visaCount"
  class="number">

0

</div>

</div>



<!-- تذاكر الطيران -->

<div class="card">

<h3>
✈️ تذاكر الطيران
</h3>

<div class="number">
0
</div>

</div>



<!-- الرحلات البرية -->

<div class="card">

<h3>
🚌 الرحلات البرية
</h3>

<div class="number">
0
</div>

</div>



<!-- خدمات النقل -->

<div class="card">

<h3>
🚐 خدمات النقل
</h3>


<button
  onclick="location.href='add-trip.html'">

➕ إضافة رحلة

</button>


<button
  onclick="location.href='transport-orders.html'">

📋 طلبات الرحلات

</button>

</div>


</div>


</div>



<script type="module">


/*
|--------------------------------------------------------------------------
| Firebase Authentication
|--------------------------------------------------------------------------
*/

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.7/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.7/firebase-auth.js";


import {
  getFirestore,
  collection,
  getCountFromServer
}
from
"https://www.gstatic.com/firebasejs/12.1.7/firebase-firestore.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyD4Zn7o0BBEAc4K7E6aW3YLh9hXFDzglVA",

  authDomain:
    "ajel-booking.firebaseapp.com",

  databaseURL:
    "https://ajel-booking-default-rtdb.firebaseio.com",

  projectId:
    "ajel-booking",

  storageBucket:
    "ajel-booking.firebasestorage.app",

  messagingSenderId:
    "385816942991",

  appId:
    "1:385816942991:web:cc9ea0bff26643547613fa",

  measurementId:
    "G-0PDL44N8TG"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const firestore =
  getFirestore(app);



/*
|--------------------------------------------------------------------------
| رابط قاعدة البيانات مباشرة
|--------------------------------------------------------------------------
*/

const DATABASE_URL =
  "https://ajel-booking-default-rtdb.firebaseio.com";



const bookingsCount =
  document.getElementById(
    "bookingsCount"
  );


const bookingsError =
  document.getElementById(
    "bookingsError"
  );



/*
|--------------------------------------------------------------------------
| قراءة عدد الحجوزات مباشرة
|--------------------------------------------------------------------------
*/

async function loadBookingsCount() {

  try {

    const url =
      DATABASE_URL +
      "/bookings.json?t=" +
      Date.now();


    const response =
      await fetch(url, {
        method: "GET",
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const bookings =
      await response.json();


    if (
      bookings === null ||
      typeof bookings !== "object"
    ) {

      bookingsCount.textContent =
        "0";

      return;

    }


    const count =
      Object.keys(bookings).length;


    bookingsCount.textContent =
      count;


    bookingsError.textContent =
      "";


    console.log(
      "عدد الحجوزات:",
      count
    );

  }

  catch(error) {

    console.error(
      "خطأ في قراءة الحجوزات:",
      error
    );


    bookingsCount.textContent =
      "0";


    bookingsError.textContent =
      "تعذر قراءة الحجوزات";

  }

}



/*
|--------------------------------------------------------------------------
| أول قراءة
|--------------------------------------------------------------------------
*/

loadBookingsCount();



/*
|--------------------------------------------------------------------------
| تحديث كل 5 ثوانٍ
|--------------------------------------------------------------------------
*/

setInterval(
  loadBookingsCount,
  5000
);



/*
|--------------------------------------------------------------------------
| تسجيل الدخول
|--------------------------------------------------------------------------
*/

onAuthStateChanged(

  auth,

  async (user) => {

    if (!user) {

      window.location.replace(
        "index.html"
      );

      return;

    }


    /*
    |--------------------------------------------------------------------------
    | عدد التأشيرات
    |--------------------------------------------------------------------------
    */

    try {

      const visaSnapshot =
        await getCountFromServer(
          collection(
            firestore,
            "visaRequests"
          )
        );


      document.getElementById(
        "visaCount"
      ).textContent =
        visaSnapshot.data().count;

    }

    catch(error) {

      console.error(
        "خطأ في قراءة التأشيرات:",
        error
      );


      document.getElementById(
        "visaCount"
      ).textContent =
        "0";

    }

  }

);



/*
|--------------------------------------------------------------------------
| تسجيل الخروج
|--------------------------------------------------------------------------
*/

document.getElementById(
  "logoutBtn"
).onclick = async function() {

  try {

    await signOut(auth);

    window.location.href =
      "index.html";

  }

  catch(error) {

    alert(
      error.message
    );

  }

};

</script>


</body>

</html>
