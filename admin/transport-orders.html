<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلبات الرحلات</title>

<style>

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
}

.header {
  background:#1d4ed8;
  color:white;
  padding:20px;
  text-align:center;
}

.container {
  max-width:1000px;
  margin:auto;
  padding:25px;
}

button {
  padding:12px 20px;
  border:0;
  border-radius:10px;
  background:#1d4ed8;
  color:white;
  cursor:pointer;
  font-size:16px;
}

.refresh {
  background:#16a34a;
}

.message {
  background:white;
  padding:15px;
  margin:20px 0;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.order {

  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);

}


.order h2 {

color:#1d4ed8;

}


.row {

margin:8px 0;
font-size:17px;

}


.label {

font-weight:bold;

}


.empty {

background:white;
padding:30px;
text-align:center;
border-radius:15px;

}


</style>

</head>


<body>


<div class="header">

<h1>طلبات الرحلات 🚐</h1>

<p>الحجوزات القادمة من التطبيق</p>

</div>



<div class="container">


<button onclick="location.href='dashboard.html'">
العودة للوحة التحكم
</button>


<button class="refresh" onclick="loadBookings()">
تحديث 🔄
</button>



<div id="message" class="message">

جاري تحميل الطلبات...

</div>



<div id="orders"></div>



</div>





<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.7/firebase-app.js";


import {

getDatabase,
ref,
get

}

from "https://www.gstatic.com/firebasejs/12.1.7/firebase-database.js";



import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.1.7/firebase-auth.js";




const firebaseConfig = {

apiKey: "AIzaSyD4Zn7o0BBEAc4K7E6aW3YLh9hXFDzglVA",

authDomain: "ajel-booking.firebaseapp.com",

databaseURL:
"https://ajel-booking-default-rtdb.firebaseio.com",

projectId:"ajel-booking",

storageBucket:
"ajel-booking.firebasestorage.app",

messagingSenderId:"385816942991",

appId:
"1:385816942991:web:cc9ea0bff26643547613fa"

};




const app = initializeApp(firebaseConfig);


const database = getDatabase(app);


const auth = getAuth(app);



const message =
document.getElementById("message");


const orders =
document.getElementById("orders");





onAuthStateChanged(auth,(user)=>{


if(!user){

message.textContent =
"يجب تسجيل الدخول أولاً";

return;

}


loadBookings();


});






async function loadBookings(){


orders.innerHTML="";

message.textContent =
"جاري تحميل الطلبات...";



try{


const snapshot =
await get(ref(database,"bookings"));



if(!snapshot.exists()){


message.textContent =
"لا توجد حجوزات حالياً";


return;

}




const bookings =
snapshot.val();



const keys =
Object.keys(bookings);



message.textContent =
"عدد الحجوزات: " + keys.length;



keys.reverse().forEach((key)=>{


const b = bookings[key];



const card =
document.createElement("div");


card.className="order";



card.innerHTML = `


<h2>
${b.fromLocation || ""}
 ← 
${b.toLocation || ""}
</h2>



<div class="row">

<span class="label">
👤 المسافر:
</span>

${b.passengerName || "-"}

</div>




<div class="row">

<span class="label">
📱 الهاتف:
</span>

${b.phone || "-"}

</div>





<div class="row">

<span class="label">
📅 التاريخ:
</span>

${b.date || "-"}

</div>





<div class="row">

<span class="label">
⏰ الوقت:
</span>

${b.time || "-"}

</div>





<div class="row">

<span class="label">
💰 السعر:
</span>

${b.price || "-"}

</div>





<div class="row">

<span class="label">
💺 عدد الركاب:
</span>

${b.passengerCount || "-"}

</div>





<div class="row">

<span class="label">
💳 الدفع:
</span>

${b.paymentMethod || "-"}

</div>





<div class="row">

<span class="label">
📌 الحالة:
</span>

${b.status || "-"}

</div>



<div class="row">

<span class="label">
🔢 رقم الحجز:
</span>

${b.bookingNumber || "-"}

</div>



`;



orders.appendChild(card);



});



}

catch(error){


console.error(error);


message.textContent =
"حدث خطأ: " + error.message;


}



}



</script>


</body>
</html>
