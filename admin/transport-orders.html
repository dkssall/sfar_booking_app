<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلبات الرحلات - أجّل</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

.header {
  background: #1d4ed8;
  color: white;
  padding: 20px;
  text-align: center;
}

.header h1 {
  margin: 0 0 8px;
}

.header p {
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.top-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  color: white;
  background: #1d4ed8;
  font-size: 15px;
  cursor: pointer;
}

.refresh {
  background: #16a34a;
}

.message {
  background: white;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.order {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
  border-right: 5px solid #1d4ed8;
}

.order h2 {
  color: #1d4ed8;
  margin-top: 0;
}

.booking-number {
  background: #eff6ff;
  color: #1d4ed8;
  padding: 10px;
  border-radius: 10px;
  font-weight: bold;
  margin-bottom: 15px;
}

.row {
  margin: 9px 0;
  font-size: 16px;
  line-height: 1.7;
}

.label {
  font-weight: bold;
}

.status {
  display: inline-block;
  background: #fef3c7;
  color: #92400e;
  padding: 5px 10px;
  border-radius: 20px;
  font-weight: bold;
}

.payment {
  display: inline-block;
  background: #f0fdf4;
  color: #166534;
  padding: 5px 10px;
  border-radius: 20px;
}

.empty {
  background: white;
  padding: 35px;
  text-align: center;
  border-radius: 15px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.live {
  color: #16a34a;
  font-size: 13px;
}

@media(max-width:600px) {

  .container {
    padding: 12px;
  }

  .top-buttons {
    display: block;
  }

  .top-buttons button {
    width: 100%;
    margin-bottom: 8px;
  }

  .order {
    padding: 16px;
  }

}

</style>

</head>


<body>


<div class="header">

<h1>طلبات الرحلات 🚐</h1>

<p>الحجوزات القادمة من تطبيق أجّل</p>

</div>


<div class="container">


<div class="top-buttons">

<button onclick="location.href='dashboard.html'">
⬅️ العودة للوحة التحكم
</button>

<button class="refresh" onclick="loadBookings()">
🔄 تحديث
</button>

</div>


<div id="message" class="message">
جاري قراءة الحجوزات...
</div>


<div id="orders"></div>


</div>



<script>


/*
|--------------------------------------------------------------------------
| رابط قاعدة البيانات
|--------------------------------------------------------------------------
*/

const DATABASE_URL =
  "https://ajel-booking-default-rtdb.firebaseio.com";


const message =
  document.getElementById("message");


const orders =
  document.getElementById("orders");



/*
|--------------------------------------------------------------------------
| حماية النصوص
|--------------------------------------------------------------------------
*/

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "-";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}



/*
|--------------------------------------------------------------------------
| تحويل وقت إنشاء الحجز
|--------------------------------------------------------------------------
*/

function formatCreatedAt(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(Number(value));

  if (isNaN(date.getTime())) {
    return "-";
  }

  return date.toLocaleString("ar-SA", {
    dateStyle: "medium",
    timeStyle: "short"
  });

}



/*
|--------------------------------------------------------------------------
| قراءة الحجوزات من Firebase REST
|--------------------------------------------------------------------------
*/

async function loadBookings() {

  message.className = "message";

  message.textContent =
    "جاري قراءة الحجوزات...";

  orders.innerHTML = "";


  try {

    const url =
      DATABASE_URL +
      "/bookings.json?t=" +
      Date.now();


    const response =
      await fetch(url, {
        method: "GET",
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const bookings =
      await response.json();


    console.log(
      "Firebase bookings:",
      bookings
    );


    /*
    |--------------------------------------------------------------------------
    | لا توجد حجوزات
    |--------------------------------------------------------------------------
    */

    if (
      bookings === null ||
      typeof bookings !== "object"
    ) {

      message.textContent =
        "لا توجد حجوزات حالياً";

      orders.innerHTML = `
        <div class="empty">
          لا توجد حجوزات حتى الآن 📭
        </div>
      `;

      return;

    }


    const keys =
      Object.keys(bookings);


    /*
    |--------------------------------------------------------------------------
    | ترتيب الأحدث أولاً
    |--------------------------------------------------------------------------
    */

    keys.sort(function(a, b) {

      const timeA =
        Number(bookings[a]?.createdAt || 0);

      const timeB =
        Number(bookings[b]?.createdAt || 0);

      return timeB - timeA;

    });


    message.innerHTML =
      "عدد الحجوزات: " +
      keys.length +
      ' <span class="live">● مباشر</span>';


    /*
    |--------------------------------------------------------------------------
    | عرض الحجوزات
    |--------------------------------------------------------------------------
    */

    keys.forEach(function(key) {

      const b =
        bookings[key] || {};


      const bookingNumber =
        escapeHtml(
          b.bookingNumber || key
        );


      const fromLocation =
        escapeHtml(
          b.fromLocation
        );


      const toLocation =
        escapeHtml(
          b.toLocation
        );


      const passengerName =
        escapeHtml(
          b.passengerName
        );


      const phone =
        escapeHtml(
          b.phone
        );


      const date =
        escapeHtml(
          b.date
        );


      const time =
        escapeHtml(
          b.time
        );


      const period =
        escapeHtml(
          b.period
        );


      const price =
        escapeHtml(
          b.price
        );


      const passengerCount =
        escapeHtml(
          b.passengerCount
        );


      const availableSeats =
        escapeHtml(
          b.availableSeats
        );


      const paymentMethod =
        escapeHtml(
          b.paymentMethod
        );


      const status =
        escapeHtml(
          b.status || "pending"
        );


      const receipt =
        b.receiptAttached === true
          ? "تم إرفاق الإيصال ✅"
          : "لا يوجد إيصال";


      const createdAt =
        escapeHtml(
          formatCreatedAt(
            b.createdAt
          )
        );


      const card =
        document.createElement("div");


      card.className =
        "order";


      card.innerHTML = `

        <div class="booking-number">
          🔢 رقم الحجز:
          ${bookingNumber}
        </div>


        <h2>
          🚐 ${fromLocation}
          ← →
          ${toLocation}
        </h2>


        <div class="row">
          <span class="label">
            👤 المسافر:
          </span>
          ${passengerName}
        </div>


        <div class="row">
          <span class="label">
            📱 الهاتف:
          </span>
          ${phone}
        </div>


        <div class="row">
          <span class="label">
            📅 التاريخ:
          </span>
          ${date}
        </div>


        <div class="row">
          <span class="label">
            ⏰ الوقت:
          </span>
          ${time}
        </div>


        <div class="row">
          <span class="label">
            🕐 الفترة:
          </span>
          ${period}
        </div>


        <div class="row">
          <span class="label">
            💰 السعر:
          </span>
          ${price}
        </div>


        <div class="row">
          <span class="label">
            👥 عدد الركاب:
          </span>
          ${passengerCount}
        </div>


        <div class="row">
          <span class="label">
            💺 المقاعد المتاحة:
          </span>
          ${availableSeats}
        </div>


        <div class="row">
          <span class="label">
            💳 طريقة الدفع:
          </span>

          <span class="payment">
            ${paymentMethod}
          </span>
        </div>


        <div class="row">
          <span class="label">
            🧾 الإيصال:
          </span>

          ${receipt}
        </div>


        <div class="row">
  <span class="label">
    📌 الحالة:
  </span>

  <span class="status">
    ${status}
  </span>
</div>




        <div class="row">
          <span class="label">
            🕒 تاريخ إنشاء الحجز:
          </span>

          ${createdAt}
        </div>
<div class="actions">

  <button
    type="button"
    class="confirmBtn"
    data-key="${key}">
    ✅ تأكيد الحجز
  </button>

  <button
    type="button"
    class="cancelBtn"
    data-key="${key}">
    ❌ إلغاء الحجز
  </button>

</div>
      `;


      orders.appendChild(card);

    });


  }

  catch(error) {

    console.error(
      "Firebase REST Error:",
      error
    );


    message.className =
      "message error";


    message.innerHTML =
      "❌ حدث خطأ في قراءة الحجوزات: " +
      escapeHtml(
        error.message
      );


    orders.innerHTML = `
      <div class="empty">
        تأكد من اتصال الإنترنت
        ومن قواعد Realtime Database.
      </div>
    `;
document.querySelectorAll('.cancelBtn').forEach(button => {
  button.addEventListener('click', function () {
    const key = this.dataset.key;
    cancelBooking(key);
  });
});
  }

}

async function confirmBooking(bookingKey) {

  if (!confirm("هل تريد تأكيد هذا الحجز؟")) {
    return;
  }

  try {

    const response = await fetch(
      DATABASE_URL +
      "/bookings/" +
      bookingKey +
      ".json",
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status: "confirmed"
        })
      }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    alert("تم تأكيد الحجز ✅");

    await loadBookings();

  } catch (error) {

    console.error(
      "خطأ في تأكيد الحجز:",
      error
    );

    alert(
      "حدث خطأ أثناء تأكيد الحجز: " +
      error.message
    );

  }

}
async function cancelBooking(bookingKey) {

  const reason = prompt(
    "اكتب سبب إلغاء الحجز:"
  );

  if (reason === null) {
    return;
  }

  if (reason.trim() === "") {
    alert("يجب كتابة سبب الإلغاء.");
    return;
  }

  try {

    const response = await fetch(
      DATABASE_URL +
      "/bookings/" +
      bookingKey +
      ".json",
      {
        method: "PATCH",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status: "cancelled",
          cancellationReason: reason.trim()
        })
      }
    );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    alert("تم إلغاء الحجز ❌");

    await loadBookings();

  } catch (error) {

    console.error(
      "خطأ في إلغاء الحجز:",
      error
    );

    alert(
      "حدث خطأ أثناء إلغاء الحجز: " +
      error.message
    );

  }

}
/*
|--------------------------------------------------------------------------
| تحميل أول مرة
|--------------------------------------------------------------------------
*/

loadBookings();

async function silentRefresh() {

  try {

    const response =
      await fetch(
        DATABASE_URL + "/bookings.json?t=" + Date.now()
      );


    const bookings =
      await response.json();


    if (
      bookings === null ||
      typeof bookings !== "object"
    ) {
      return;
    }


    const count =
      Object.keys(bookings).length;


    const currentCount =
      document.querySelectorAll(".order").length;


    if (count !== currentCount) {

      loadBookings();

    }


  }

  catch(error) {

    console.log(
      "تحديث صامت:",
      error
    );

  }

}

/*
|--------------------------------------------------------------------------
| تحديث تلقائي كل 5 ثوانٍ
|--------------------------------------------------------------------------
*/

setInterval(
  silentRefresh,
  5000
);

</script>


</body>

</html>
