<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إدارة أجّل</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <h1>أجّل</h1>

      <p>لوحة إدارة الحجوزات</p>

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
      >

      <button id="loginBtn" type="button">
        دخول
      </button>

      <p id="loginMessage"></p>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyD4Zn7o0BBEAc4K7E6aW3YLh9hXFDzglVA",
      authDomain: "ajel-booking.firebaseapp.com",
      databaseURL: "https://ajel-booking-default-rtdb.firebaseio.com",
      projectId: "ajel-booking",
      storageBucket: "ajel-booking.firebasestorage.app",
      messagingSenderId: "385816942991",
      appId: "1:385816942991:web:cc9ea0bff26643547613fa",
      measurementId: "G-0PDL44N8TG"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const loginMessage = document.getElementById("loginMessage");


    // إذا كان المستخدم مسجل الدخول مسبقًا
    


    // تسجيل الدخول
    loginBtn.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      loginMessage.textContent = "";

      if (!email || !password) {

        loginMessage.textContent =
          "أدخل البريد الإلكتروني وكلمة المرور";

        loginMessage.style.color = "red";

        return;
      }


      loginBtn.disabled = true;
      loginBtn.textContent = "جاري الدخول...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        loginMessage.textContent =
          "تم تسجيل الدخول بنجاح...";

        loginMessage.style.color = "green";

        window.location.href = "./dashboard.html";


      } catch (error) {

        console.error(error);

        loginBtn.disabled = false;
        loginBtn.textContent = "دخول";


        if (error.code === "auth/invalid-credential") {

          loginMessage.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة";

        } else if (error.code === "auth/invalid-email") {

          loginMessage.textContent =
            "البريد الإلكتروني غير صحيح";

        } else if (error.code === "auth/too-many-requests") {

          loginMessage.textContent =
            "تمت محاولات كثيرة، حاول لاحقًا";

        } else {

          loginMessage.textContent =
            "حدث خطأ أثناء تسجيل الدخول: " + error.message;

        }

        loginMessage.style.color = "red";

      }

    });

  </script>

</body>
</html>
